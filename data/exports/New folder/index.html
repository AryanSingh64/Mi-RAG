<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enterprise RAG Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --accent: #3b82f6;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
    header { padding: 1rem 2rem; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #1e3a8a; color: #93c5fd; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8rem; }
    #chat-box { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .msg { max-width: 80%; padding: 1rem 1.25rem; border-radius: 0.75rem; line-height: 1.5; }
    .user-msg { background: var(--accent); color: #fff; align-self: flex-end; }
    .bot-msg { background: var(--card); border: 1px solid var(--border); align-self: flex-start; }
    .citations { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); }
    .citation-tag { display: inline-block; background: #1f2937; padding: 0.2rem 0.5rem; border-radius: 4px; margin-right: 0.4rem; margin-top: 0.2rem; }
    #input-form { padding: 1.25rem 2rem; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 0.75rem; }
    input { flex: 1; padding: 0.85rem 1.25rem; border-radius: 0.5rem; border: 1px solid var(--border); background: #1f2937; color: #fff; outline: none; font-size: 1rem; }
    button { background: var(--accent); color: white; border: none; padding: 0.85rem 1.5rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <header>
    <h2>⚡ Enterprise Knowledge Assistant</h2>
    <span class="badge">Model: llama3.2:1b</span>
  </header>
  <div id="chat-box">
    <div class="msg bot-msg">Hello! I am your private, grounded enterprise knowledge assistant. Ask me anything about your documents.</div>
  </div>
  <form id="input-form">
    <input type="text" id="user-input" placeholder="Ask a question about your documents..." required autocomplete="off">
    <button type="submit" id="send-btn">Send</button>
  </form>
  <script>
    const form = document.getElementById('input-form');
    const input = document.getElementById('user-input');
    const chat = document.getElementById('chat-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      chat.innerHTML += `<div class="msg user-msg">${q}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      const botId = 'bot-' + Date.now();
      chat.innerHTML += `<div class="msg bot-msg" id="${botId}">Thinking...</div>`;
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, top_k: 3 })
        });
        const data = await res.json();
        let citationsHtml = '';
        if (data.citations && data.citations.length > 0) {
          citationsHtml = '<div class="citations"><b>Sources:</b><br>' + 
            data.citations.map(c => `<span class="citation-tag">📄 ${c.source_file} (${Math.round(c.relevance_score * 100)}%)</span>`).join('') + '</div>';
        }
        document.getElementById(botId).innerHTML = data.answer.replace(/\n/g, '<br>') + citationsHtml;
      } catch (err) {
        document.getElementById(botId).innerText = "Error contacting API: " + err.message;
      }
      chat.scrollTop = chat.scrollHeight;
    });
  </script>
</body>
</html>
